    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hadron_theme_preference');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-theme-base text-theme-text-main overflow-x-hidden font-mono transition-colors duration-400">
    <div id="root"></div>
